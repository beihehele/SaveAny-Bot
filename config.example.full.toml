# ============================================================
# 用户白名单（填写你的 Telegram User ID）
# ============================================================

[[users]]
id = 123456789            # @userinfobot 可查询
storages = []             # 空列表 + blacklist=true → 可用全部存储
blacklist = true

# [[users]]
# id = 987654321
