# Telegram 文件本地保存与监听转发；配置文件使用 UTF-8。
# 环境变量前缀 SAVEANY_，例如 SAVEANY_TELEGRAM_TOKEN。
lang = "zh-Hans"
workers = 4
retry = 3
threads = 4
stream = false

# 全局 HTTP 代理（可选）；Telegram MTProto 使用 telegram.proxy。
# proxy = "socks5://127.0.0.1:7890"

[db]
path = "data/saveany.db"
session = "data/session.db"

[temp]
base_path = "cache/"

[cache]
ttl = 86400
num_counters = 100000
max_cost = 1000000

[log]
level = "info"

[telegram]
token = "YOUR_BOT_TOKEN"
# 推荐填写自己的 Telegram API ID / Hash。
# app_id = 12345678
# app_hash = "YOUR_APP_HASH"
rpc_retry = 5
media_group_timeout = 5

[telegram.proxy]
enable = false
url = "socks5://127.0.0.1:7890"

# /watch、/copy、聊天查询及 /syncpeers 需要启用并登录 Userbot。
[telegram.userbot]
enable = false
session = "data/usersession.db"

[hook.exec]
timeout = "30s"
# task_before_start = "echo starting"
# task_success = "echo completed"
# task_fail = "echo failed"
# task_cancel = "echo cancelled"

[api]
enable = false
host = "127.0.0.1"
port = 8080
token = ""

# 固定账号 admin；启用时 password / password_hash 必须且只能设置一个。
# 密码为 12–1024 字节；运行 saveany-bot admin-password 生成哈希。
[admin]
enable = false
host = "127.0.0.1"
port = 8081
# password = "replace-with-your-long-password"
# password_hash = "$argon2id$..."
session_ttl = "12h"
secure_cookie = false

# 可以配置多个独立的本地存储；名称应与已有默认目录/规则保持一致。
[[storages]]
name = "本机1"
type = "local"
enable = true
base_path = "./downloads"

[[users]]
id = 114514
storages = []
blacklist = true
