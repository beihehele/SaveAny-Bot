# blacklist = false

# ============================================================
# watch 命令速查（需 UserBot）
#   /watch <source>              保存到默认存储（target=0）
#   /watch <source> <target>     UserBot 转发到目标群/频道
#   /watch <source> msgre:.*x.*  带过滤器保存
#   /lswatch                     列出 [id] source target [filter]
#   /unwatch <id>                按主键删除
# ============================================================
