    copy_help_text: "Use /copy to copy historical messages to a target chat via UserBot DropAuthor with a clickable [转] link at the start (source deletion does not affect the copy; no local storage). Requires UserBot. Use target:topicId for a forum topic. target=0 is not supported.\n\nSyntax:\n/copy <source_id> <target_id[:topicId]> [filter] [count]\n\nParameters:\n- <source_id>: Source chat ID or username\n- <target_id[:topicId]>: Target chat ID (required, cannot be 0); :topicId is forum topic ID (from /lstopic)\n- [filter]: Optional msgre:<boolean expression> (& | ! () keywords, case-insensitive)\n- [count]: Optional hit count, default 500, max 5000\n\nExamples:\n/copy -1002229835658 -1003333444555\n/copy -1002229835658 -1003333444555:12345 msgre:plana|planb\n/copy -1002229835658 -1003333444555 msgre:plana&(planb|planc) 100\n/copy -1002229835658 -1003333444555 50\n"
