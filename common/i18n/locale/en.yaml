    watch_help_text: "Use /watch to watch a chat. target=0 (or omitted) saves to default storage; a non-zero target is copied via UserBot DropAuthor with a clickable [转] link at the start (source deletion does not affect the copy). Use target:topicId for a forum topic.\n\nSyntax:\n/watch <source_id> [target_id[:topicId]] [filter]\n/lswatch\n/unwatch <id>\n/lschannel\n/lsgroup\n/lstopic <group_id>\n\nParameters:\n- <source_id>: Source chat ID or username\n- [target_id[:topicId]]: Target chat ID; 0 means save to default storage; :topicId is forum topic ID (from /lstopic)\n- [filter]: Optional msgre:<boolean expression> (& | ! () keywords, case-insensitive)\n\nExamples:\n/watch -1002229835658\n/watch -1002229835658 0 msgre:plana|planb\n/watch -1002229835658 -1003333444555\n/watch -1002229835658 -1003333444555:12345\n/watch -1002229835658 -1003333444555:12345 msgre:plana&(planb|planc)\n"
