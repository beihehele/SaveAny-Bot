    watch_help_text: "使用 /watch 监听聊天。target=0（或省略）时保存到默认存储；target 为频道/群 ID 时由 UserBot 无来源复制（DropAuthor）并在开头附带可点击的 [转] 链接；源消息删除不影响副本。目标可为 target:topicId 指定论坛话题。\n\n命令语法:\n/watch <source_id> [target_id[:topicId]] [filter]\n/lswatch\n/unwatch <id>\n/lschannel\n/lsgroup\n/lstopic <group_id>\n\n参数:\n- <source_id>: 源聊天 ID 或用户名\n- [target_id[:topicId]]: 目标聊天 ID，0 表示保存到默认存储；:topicId 为论坛话题 ID（见 /lstopic）\n- [filter]: 可选 msgre:<布尔表达式>（& | ! () 关键词，不区分大小写）\n\n命令示例:\n/watch -1002229835658\n/watch -1002229835658 0 msgre:plana|planb\n/watch -1002229835658 -1003333444555\n/watch -1002229835658 -1003333444555:12345\n/watch -1002229835658 -1003333444555:12345 msgre:plana&(planb|planc)\n"
