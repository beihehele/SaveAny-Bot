    copy_help_text: "使用 /copy 将源聊天历史消息无来源复制到目标聊天（DropAuthor，并在开头附带可点击的 [转] 链接；源删除不影响副本；不落本地存储）。需开启 UserBot。目标可为 target:topicId 指定论坛话题。不支持 target=0。\n\n命令语法:\n/copy <source_id> <target_id[:topicId]> [filter] [count]\n\n参数:\n- <source_id>: 源聊天 ID 或用户名\n- <target_id[:topicId]>: 目标聊天 ID（必填，不可为 0）；:topicId 为论坛话题 ID（见 /lstopic）\n- [filter]: 可选 msgre:<布尔表达式>（& | ! () 关键词，不区分大小写）\n- [count]: 可选，命中条数，默认 500，最大 5000\n\n命令示例:\n/copy -1002229835658 -1003333444555\n/copy -1002229835658 -1003333444555:12345 msgre:plana|planb\n/copy -1002229835658 -1003333444555 msgre:plana&(planb|planc) 100\n/copy -1002229835658 -1003333444555 50\n"
