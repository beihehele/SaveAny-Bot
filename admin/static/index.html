<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SaveAny · Admin</title>
  <link rel="stylesheet" href="/admin/assets/style.css">
  <script src="/admin/assets/management.js" defer></script>
  <script src="/admin/assets/preferences.js" defer></script>
  <script src="/admin/assets/app.js" defer></script>
</head>
<body>
  <div id="boot" class="boot" role="status">SaveAny</div>
  <main id="login-view" class="login-view" hidden>
    <section class="login-card">
      <div class="brand-mark" aria-hidden="true">S</div><p class="eyebrow">SAVEANY BOT</p>
      <h1 data-i18n="loginTitle"></h1><p class="muted" data-i18n="loginDescription"></p>
      <form id="login-form">
        <label for="username" data-i18n="username"></label><input id="username" name="username" value="admin" autocomplete="username" readonly>
        <label for="password" data-i18n="password"></label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="1024">
        <p id="login-error" class="error" role="alert" hidden></p>
        <button id="login-submit" type="submit" class="primary full" data-i18n="login"></button>
      </form>
      <p class="small muted" data-i18n="passwordConfigNote"></p>
    </section>
  </main>
  <div id="console" class="console" hidden>
    <aside class="sidebar">
      <a class="brand" href="#overview"><span class="brand-mark" aria-hidden="true">S</span><span>SaveAny<span class="brand-sub" data-i18n="consoleName"></span></span></a>
      <p class="nav-label" data-i18n="workspace"></p>
      <nav id="navigation" data-i18n-aria-label="workspace">
        <a href="#overview" data-page="overview"><span aria-hidden="true">◫</span><span data-i18n="overview"></span></a>
        <a href="#tasks" data-page="tasks"><span aria-hidden="true">≡</span><span data-i18n="tasks"></span></a>
        <a href="#new" data-page="new"><span aria-hidden="true">＋</span><span data-i18n="new"></span></a>
        <a href="#storages" data-page="storages"><span aria-hidden="true">▤</span><span data-i18n="storages"></span></a>
        <a href="#files" data-page="files"><span aria-hidden="true">▱</span><span data-i18n="files"></span></a>
        <a href="#routes" data-page="routes"><span aria-hidden="true">⇄</span><span data-i18n="routes"></span></a>
        <a href="#preferences" data-page="preferences"><span aria-hidden="true">☷</span><span data-i18n="preferences"></span></a>
        <a href="#diagnostics" data-page="diagnostics"><span aria-hidden="true">⊙</span><span data-i18n="diagnostics"></span></a>
      </nav>
      <div class="sidebar-footer"><span class="avatar">A</span><div>admin<small data-i18n="administrator"></small></div></div>
    </aside>
    <div class="main-layout">
      <header class="topbar"><div><p class="eyebrow" data-i18n="consoleName"></p><h1 id="page-title"></h1></div><div class="top-actions"><button id="refresh" class="secondary" data-i18n="refresh"></button><button id="logout" class="secondary" data-i18n="logout"></button></div></header>
      <main class="content">
        <p id="page-error" class="error banner" role="alert" hidden></p>
        <section id="page-overview" class="page" hidden><p class="intro" data-i18n="overviewDescription"></p><div id="overview-metrics" class="metrics"></div><div class="two-columns"><article class="panel"><h2 data-i18n="serviceInformation"></h2><dl id="service-information" class="definition-list"></dl></article><article class="panel"><h2 data-i18n="taskCapabilities"></h2><div id="overview-capabilities"></div><p class="small muted" data-i18n="capabilityNote"></p></article></div>
          <article id="outbox-panel" class="panel" hidden><div class="panel-heading"><h2 data-i18n="outboxTitle"></h2><a href="#tasks" data-i18n="viewAll"></a></div><div id="outbox-summary"></div><p class="small muted" data-i18n="outboxNote"></p></article>
          <article class="panel"><div class="panel-heading"><h2 data-i18n="recentTasks"></h2><a href="#tasks" data-i18n="viewAll"></a></div><div id="overview-tasks"></div></article></section>
        <section id="page-tasks" class="page" hidden><p class="note" data-i18n="taskScopeNote"></p><div class="toolbar"><label class="sr-only" for="task-search" data-i18n="search"></label><input id="task-search" type="search" data-i18n-placeholder="searchTasks"><label class="sr-only" for="task-status" data-i18n="status"></label><select id="task-status"><option value="" data-i18n="allStatuses"></option><option value="queued" data-i18n="queued"></option><option value="running" data-i18n="running"></option><option value="cancelling" data-i18n="cancelling"></option><option value="completed" data-i18n="completed"></option><option value="failed" data-i18n="failed"></option><option value="cancelled" data-i18n="cancelled"></option></select><a class="button primary" href="#new" data-i18n="new"></a></div><article class="panel"><div id="task-table"></div><div id="task-pagination" class="pagination"></div></article></section>
        <section id="page-new" class="page" hidden><p class="intro" data-i18n="newDescription"></p>
<div class="task-mode-tabs" role="tablist" data-i18n-aria-label="taskMode">
<button id="new-save-tab" type="button" role="tab" data-new-mode="save" aria-selected="true" aria-controls="new-save-panel" data-i18n="saveLocally"></button>
<button id="new-copy-tab" type="button" role="tab" data-new-mode="copy" aria-selected="false" aria-controls="new-copy-panel" tabindex="-1" data-i18n="copyWizard"></button>
</div><article id="new-save-panel" role="tabpanel" aria-labelledby="new-save-tab" class="panel form-panel"><p class="muted" data-i18n="saveDescription"></p><form id="task-form"><div class="form-grid"><div><label for="task-type" data-i18n="taskType"></label><select id="task-type" required></select></div><div><label for="target-storage" data-i18n="targetStorage"></label><select id="target-storage" required></select></div></div><label for="target-path" data-i18n="targetPath"></label><input id="target-path" value="/" maxlength="4096"><div id="url-fields"><label id="urls-label" for="task-urls" data-i18n="urls"></label><textarea id="task-urls" rows="6" data-i18n-placeholder="urlsPlaceholder"></textarea></div><p id="task-type-note" class="small muted"></p><div id="task-submission-results" role="status"></div><button id="task-submit" type="submit" class="primary" data-i18n="submitTask"></button></form></article><article id="new-copy-panel" role="tabpanel" aria-labelledby="new-copy-tab" class="panel form-panel" hidden><p class="muted" data-i18n="copyDescription"></p><form id="copy-form">
<label for="copy-user" data-i18n="telegramUser"></label><select id="copy-user" required></select>
<label for="copy-source-input" data-i18n="sourceChat"></label><div class="input-action"><div id="copy-source-control" class="chat-select"><input id="copy-source-input" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="copy-source-options" autocomplete="off" required data-i18n-placeholder="searchChats"><button id="copy-source-toggle" type="button" class="chat-select-toggle" tabindex="-1" data-i18n-aria-label="chooseSource"><span aria-hidden="true">▾</span></button><div id="copy-source-options" class="chat-options" role="listbox" data-i18n-aria-label="sourceChat" hidden></div><input id="copy-source" type="hidden"></div><button id="copy-source-refresh" type="button" class="secondary" data-i18n="refreshList" data-i18n-aria-label="refreshSourceList"></button></div>
<div id="copy-target-fields"><label for="copy-target" data-i18n="managedTarget"></label><div class="input-action"><select id="copy-target" required><option value="" data-i18n="chooseTarget"></option></select><button id="copy-target-refresh" type="button" class="secondary" data-i18n="refreshList" data-i18n-aria-label="refreshTargetList"></button></div><p class="small muted" data-i18n="managedTargetNote"></p></div>
<p id="copy-chats-status" class="small muted" role="status"></p>
<div id="copy-topic-fields" hidden><label for="copy-topics" data-i18n="topicId"></label><div class="input-action"><select id="copy-topics"><option value="" data-i18n="noTopic"></option></select><button id="copy-topics-refresh" type="button" class="secondary" data-i18n="refreshList" data-i18n-aria-label="refreshTopicList"></button></div><p id="copy-topics-status" class="small muted" role="status"></p></div>
<details id="copy-filter-details" class="filter-details"><summary><span data-i18n="optionalFilter"></span><span id="copy-filter-summary" class="filter-summary"></span></summary><fieldset class="filter-editor"><legend class="sr-only" data-i18n="filter"></legend><fieldset id="copy-filter-format" class="radio-group"><legend data-i18n="filterMode"></legend><div class="radio-options"><label><input type="radio" name="copy-filter-format" value="simple" checked><span data-i18n="simpleKeywords"></span></label><label><input type="radio" name="copy-filter-format" value="expression"><span data-i18n="combinedExpression"></span></label></div></fieldset><div id="copy-simple-filter"><fieldset id="copy-filter-mode" class="radio-group"><legend data-i18n="keywordMatch"></legend><div class="radio-options"><label><input type="radio" name="copy-filter-mode" value="any" checked><span data-i18n="keywordAny"></span></label><label><input type="radio" name="copy-filter-mode" value="all"><span data-i18n="keywordAll"></span></label></div></fieldset><label for="copy-keywords" data-i18n="includeKeywords"></label><textarea id="copy-keywords" rows="3" maxlength="3000" data-i18n-placeholder="keywordPlaceholder"></textarea><label for="copy-exclude" data-i18n="excludeKeywords"></label><textarea id="copy-exclude" rows="2" maxlength="3000" data-i18n-placeholder="excludePlaceholder"></textarea><p class="small muted" data-i18n="keywordNote"></p></div>
<div id="copy-expression-fields" hidden><label for="copy-expression" data-i18n="combinedExpression"></label><textarea id="copy-expression" rows="2" maxlength="4096" data-i18n-placeholder="expressionPlaceholder"></textarea><p class="small muted" data-i18n="expressionNote"></p></div><details class="sample-details"><summary data-i18n="testFilter"></summary><label for="copy-sample" data-i18n="sampleCaption"></label><textarea id="copy-sample" rows="2" maxlength="8192" data-i18n-placeholder="sampleCaptionPlaceholder"></textarea><button id="copy-filter-test" type="button" class="secondary" data-i18n="testFilter"></button><p id="copy-filter-result" class="small" role="status"></p></details><p id="copy-filter-error" class="error" role="alert" hidden></p></fieldset></details>
<div id="copy-submission-results" role="status"></div>
<label for="copy-count" data-i18n="copyCount"></label><input id="copy-count" type="number" value="20" min="1" max="5000" required><p class="small muted" data-i18n="copyCountNote"></p><button id="copy-submit" type="submit" class="primary" data-i18n="createCopy"></button></form></article></section>
        <section id="page-storages" class="page" hidden><p class="note" data-i18n="storageNote"></p><div id="storage-cards" class="storage-grid"></div></section>
        <section id="page-files" class="page" hidden><p class="note" data-i18n="fileNote"></p><form id="file-form" class="toolbar"><label class="sr-only" for="file-storage" data-i18n="storage"></label><select id="file-storage"></select><label class="sr-only" for="file-path" data-i18n="path"></label><input id="file-path" value="/"><button type="submit" class="primary" data-i18n="openDirectory"></button><button id="file-up" type="button" class="secondary" data-i18n="parentDirectory"></button></form><article class="panel"><div id="file-table"></div><div id="file-pagination" class="pagination"></div></article></section>
        <section id="page-routes" class="page" hidden><p class="note" data-i18n="routesNote"></p><article class="panel form-panel"><h2 data-i18n="createRoute"></h2><p class="muted" data-i18n="managementNote"></p><form id="watch-form">
<label for="watch-user" data-i18n="telegramUser"></label><select id="watch-user" required></select>
<label for="watch-source-input" data-i18n="sourceChat"></label><div class="input-action"><div id="watch-source-control" class="chat-select"><input id="watch-source-input" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="watch-source-options" autocomplete="off" required data-i18n-placeholder="searchChats"><button id="watch-source-toggle" type="button" class="chat-select-toggle" tabindex="-1" data-i18n-aria-label="chooseSource"><span aria-hidden="true">▾</span></button><div id="watch-source-options" class="chat-options" role="listbox" data-i18n-aria-label="sourceChat" hidden></div><input id="watch-source" type="hidden"></div><button id="watch-source-refresh" type="button" class="secondary" data-i18n="refreshList" data-i18n-aria-label="refreshSourceList"></button></div>
<fieldset id="watch-destination" class="radio-group"><legend data-i18n="destinationMode"></legend><div class="radio-options"><label><input type="radio" name="watch-destination" value="local" checked><span data-i18n="saveLocally"></span></label><label><input type="radio" name="watch-destination" value="chat"><span data-i18n="forwardToChat"></span></label></div></fieldset><div id="watch-target-fields"><label for="watch-target" data-i18n="managedTarget"></label><div class="input-action"><select id="watch-target" required><option value="" data-i18n="chooseTarget"></option></select><button id="watch-target-refresh" type="button" class="secondary" data-i18n="refreshList" data-i18n-aria-label="refreshTargetList"></button></div><p class="small muted" data-i18n="managedTargetNote"></p></div>
<div id="watch-local-settings" class="local-settings"><p id="watch-local-path" class="small"></p><p id="watch-local-rules" class="small muted" data-i18n="localRulesNote" hidden></p><a id="watch-local-settings-link" href="#preferences" data-i18n="editSavePreferences"></a></div>
<p id="watch-chats-status" class="small muted" role="status"></p>
<div id="watch-topic-fields" hidden><label for="watch-topics" data-i18n="topicId"></label><div class="input-action"><select id="watch-topics"><option value="" data-i18n="noTopic"></option></select><button id="watch-topics-refresh" type="button" class="secondary" data-i18n="refreshList" data-i18n-aria-label="refreshTopicList"></button></div><p id="watch-topics-status" class="small muted" role="status"></p></div>
<details id="watch-filter-details" class="filter-details"><summary><span data-i18n="optionalFilter"></span><span id="watch-filter-summary" class="filter-summary"></span></summary><fieldset class="filter-editor"><legend class="sr-only" data-i18n="filter"></legend><fieldset id="watch-filter-format" class="radio-group"><legend data-i18n="filterMode"></legend><div class="radio-options"><label><input type="radio" name="watch-filter-format" value="simple" checked><span data-i18n="simpleKeywords"></span></label><label><input type="radio" name="watch-filter-format" value="expression"><span data-i18n="combinedExpression"></span></label></div></fieldset><div id="watch-simple-filter"><fieldset id="watch-filter-mode" class="radio-group"><legend data-i18n="keywordMatch"></legend><div class="radio-options"><label><input type="radio" name="watch-filter-mode" value="any" checked><span data-i18n="keywordAny"></span></label><label><input type="radio" name="watch-filter-mode" value="all"><span data-i18n="keywordAll"></span></label></div></fieldset><label for="watch-keywords" data-i18n="includeKeywords"></label><textarea id="watch-keywords" rows="3" maxlength="3000" data-i18n-placeholder="keywordPlaceholder"></textarea><label for="watch-exclude" data-i18n="excludeKeywords"></label><textarea id="watch-exclude" rows="2" maxlength="3000" data-i18n-placeholder="excludePlaceholder"></textarea><p class="small muted" data-i18n="keywordNote"></p></div>
<div id="watch-expression-fields" hidden><label for="watch-expression" data-i18n="combinedExpression"></label><textarea id="watch-expression" rows="2" maxlength="4096" data-i18n-placeholder="expressionPlaceholder"></textarea><p class="small muted" data-i18n="expressionNote"></p></div><details class="sample-details"><summary data-i18n="testFilter"></summary><label for="watch-sample" data-i18n="sampleCaption"></label><textarea id="watch-sample" rows="2" maxlength="8192" data-i18n-placeholder="sampleCaptionPlaceholder"></textarea><button id="watch-filter-test" type="button" class="secondary" data-i18n="testFilter"></button><p id="watch-filter-result" class="small" role="status"></p></details><p id="watch-filter-error" class="error" role="alert" hidden></p></fieldset></details>
<p class="note" data-i18n="watchMediaNote"></p><div id="watch-submission-results" role="status"></div>
<button id="watch-submit" type="submit" class="primary" data-i18n="createRoute"></button></form></article><div id="route-table"></div></section>
        <section id="page-preferences" class="page" hidden><p class="note" data-i18n="preferencesNote"></p><article class="panel form-panel"><h2 data-i18n="previewTitle"></h2><p class="muted" data-i18n="previewNote"></p><form id="preview-form"><label for="preview-user" data-i18n="telegramUser"></label><select id="preview-user" required></select><label for="preview-filter" data-i18n="filter"></label><input id="preview-filter" maxlength="4096" placeholder="msgre:…"><label for="preview-text" data-i18n="sampleText"></label><textarea id="preview-text" maxlength="8192" rows="3"></textarea><label for="preview-template" data-i18n="filenameTemplate"></label><input id="preview-template" maxlength="4096" value="{{.msgid}}_{{.origname}}"><label for="preview-original" data-i18n="originalName"></label><input id="preview-original" maxlength="256" value="sample.mp4"><button type="submit" class="secondary" data-i18n="preview"></button></form><p id="preview-result" role="status"></p></article><div id="preference-cards"></div></section>
        <section id="page-diagnostics" class="page" hidden><div class="two-columns"><article class="panel"><h2 data-i18n="runtimeSettings"></h2><dl id="runtime-settings" class="definition-list"></dl></article><article class="panel"><h2 data-i18n="deploymentNotes"></h2><p class="muted" data-i18n="startupNote"></p><p class="muted" data-i18n="configurationNote"></p></article></div><article class="panel"><h2 data-i18n="auditLog"></h2><p class="small muted" data-i18n="auditNote"></p><h2 data-i18n="watchHealth"></h2><p class="muted" data-i18n="watchHealthNote"></p><dl id="watch-health" class="definition-list"></dl><h2 data-i18n="forwardHealth"></h2><p class="muted" data-i18n="forwardHealthNote"></p><dl id="forward-health" class="definition-list"></dl><h2 data-i18n="availableDisk"></h2><div id="disk-health"></div><h2 data-i18n="scanHealth"></h2><p class="muted" data-i18n="scanHealthNote"></p><div id="scan-health"></div><div id="audit-table"></div></article></section>
        <footer class="content-footer"><span data-i18n="readOnlyScope"></span><span id="last-refresh"></span></footer>
      </main>
    </div>
  </div>
  <dialog id="task-dialog"><div class="panel-heading"><h2 data-i18n="taskDetails"></h2><button id="close-dialog" class="secondary" data-i18n="close"></button></div><dl id="task-details" class="definition-list"></dl><p id="task-detail-error" class="error" hidden></p></dialog>
  <dialog id="input-dialog"><div class="panel-heading"><h2 id="input-heading"></h2><button id="close-input-dialog" class="secondary" data-i18n="close"></button></div><pre id="input-details" class="small"></pre></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="settings-dialog" aria-labelledby="settings-heading"><div class="panel-heading"><h2 id="settings-heading"></h2><button id="settings-close" type="button" class="secondary" data-i18n="cancelEdit"></button></div><form id="settings-form"><div id="settings-fields" class="settings-fields"></div><p id="settings-error" class="error" role="alert" hidden></p><button id="settings-submit" type="submit" class="primary" data-i18n="saveSetting"></button></form></dialog>
</body>
</html>
