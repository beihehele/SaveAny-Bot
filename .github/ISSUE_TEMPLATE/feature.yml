name: "⭐️ Feature Request"
description: "Feature request"
labels:
  - "enhancement"
body:
  - type: markdown
    attributes:
      value: |
        Please describe the feature you want in detail.
        请详细描述你想要的功能。

        ---

        ## Current scope / 当前范围

        This fork saves Telegram files to Local roots and manages chat watches,
        history copying, media groups, topics, rules and its optional admin console.
        本分支提供 Telegram 文件本地保存、聊天监听、历史复制、媒体组、Topic、
        规则和可选管理后台。请描述具体使用场景、现有行为及预期结果。

        Website parsers, remote storage backends, local-file uploads to Telegram,
        and Bot/CLI self-update have been removed from this version.
        网站解析器、远端存储、本地文件再次上传 Telegram 和 Bot/CLI 自更新
        已从当前版本移除。

        Explain how the feature preserves album boundaries, forwarding semantics,
        and existing local saves. Use content you are authorized to access.
        请说明如何保留媒体组边界、转发语义及现有本地保存行为，
        并仅使用你有权访问的内容。
  - type: textarea
    attributes:
      label: "⭐️ Feature description"
      description: "What new feature you want to see?"
      placeholder: "Add ... in order to ..."
    validations:
      required: true
  - type: textarea
    attributes:
      label: "🌈 Your view"
      description: "How do you see this feature will be used and/or implemented?"
      placeholder: "It should be like ..."
  - type: textarea
    attributes:
      label: "🧐 Code example"
      description: "You can provide code (or pseudocode) example"
      placeholder: "Cool code that will work ..."
      render: Go
  - type: markdown
    attributes:
      value: |
        ## Thank you for contributing to the project :slightly_smiling_face:
