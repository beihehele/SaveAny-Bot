name: Build Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
  create-release:
    needs: quality
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
          generate_release_notes: true
          body_path: docs/releases/telegram-local.md

  build-matrix:
    needs: [quality, create-release]
    name: Release Go Binary
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: windows
            goarch: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract version from Git Ref
        id: extract_version
        run: |
          VERSION=$(echo "${{ github.ref }}" | sed 's/refs\/tags\/v//')
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV

      - name: Release Go Binary
        uses: wangyoucao577/go-release-action@v1
        with:
          goversion: '1.26.9'
          pre_command: export CGO_ENABLED=0
          goos: ${{ matrix.goos }}
          goarch: ${{ matrix.goarch }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          extra_files: |
            LICENSE
            README.md
            README_zh.md
            config.example.toml
            config.example.full.toml
            docs/releases/telegram-local.md
          ldflags: >-
            -s -w
            -X "github.com/krau/SaveAny-Bot/config.Version=${{ env.VERSION }}"
            -X "github.com/krau/SaveAny-Bot/config.BuildTime=${{ env.BUILD_TIME }}"
            -X "github.com/krau/SaveAny-Bot/config.GitCommit=${{ github.sha }}"
          binary_name: saveany-bot
          sha256sum: 'true'
        env:
          VERSION: ${{ env.VERSION }}
