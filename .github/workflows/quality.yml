name: Quality

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly -p=2
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.9'
          cache-dependency-path: go.sum
      - name: Install media test dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Verify modules
        run: go mod verify
      - name: Check container entrypoint contracts
        run: sh tests/entrypoint_test.sh
      - name: Test and vet
        run: |
          go test ./...
          go vet ./...
      - name: Race regression
        run: go test -race ./...
      - name: Test optional feature variants
        run: |
          go test -tags=no_playwright ./parsers/... ./api
          go test -tags=sqlite_glebarez ./database
      - name: Build supported variants
        env:
          CGO_ENABLED: '0'
        run: |
          go build -trimpath -o "$RUNNER_TEMP/saveany-linux" .
          GOOS=windows GOARCH=amd64 go build -trimpath -o "$RUNNER_TEMP/saveany-windows.exe" .
          go build -trimpath -tags=no_jsparser,no_minio,no_bubbletea -o "$RUNNER_TEMP/saveany-micro" .
          go build -trimpath -tags=no_jsparser,no_minio,sqlite_glebarez,no_bubbletea -o "$RUNNER_TEMP/saveany-pico" .
      - name: Check reachable vulnerabilities
        run: |
          GOBIN="$RUNNER_TEMP/tools" go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          "$RUNNER_TEMP/tools/govulncheck" ./...
