name: Quality

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly -p=2
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.9'
          cache-dependency-path: go.sum
      - name: Verify modules
        run: go mod verify
      - name: Check container entrypoint contracts
        run: sh tests/entrypoint_test.sh
      - name: Test and vet
        run: |
          go test ./...
          go vet ./...
      - name: Race regression
        run: go test -race ./...
      - name: Test optional feature variants
        run: |
          go test -tags=sqlite_glebarez ./database
      - name: Build supported variants
        env:
          CGO_ENABLED: '0'
        run: |
          go build -trimpath -o "$RUNNER_TEMP/saveany-linux" .
          GOOS=windows GOARCH=amd64 go build -trimpath -o "$RUNNER_TEMP/saveany-windows.exe" .
          go build -trimpath -tags=sqlite_glebarez -o "$RUNNER_TEMP/saveany-sqlite-alternate" .
      - name: Check reachable vulnerabilities
        run: |
          GOBIN="$RUNNER_TEMP/tools" go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          "$RUNNER_TEMP/tools/govulncheck" ./...

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly -p=2
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.9'
          cache-dependency-path: go.sum
      - name: Compile container regression binaries
        env:
          CGO_ENABLED: '0'
        run: |
          go test -c -o "$RUNNER_TEMP/core-tests" ./core
          go test -c -o "$RUNNER_TEMP/database-tests" ./database
      - name: Prepare excluded build-context fixtures
        run: |
          test ! -e config.toml
          printf 'private configuration fixture\n' > config.toml
          mkdir tmp-container-smoke
          printf 'private validation fixture\n' > tmp-container-smoke/private.txt
      - uses: docker/setup-buildx-action@v3
      - name: Build builder image for context checks
        uses: docker/build-push-action@v6
        with:
          context: .
          target: builder
          load: true
          push: false
          tags: saveany-quality:builder
          build-args: |
            VERSION=ci
            GitCommit=${{ github.sha }}
            BuildTime=ci
          cache-from: type=gha,scope=quality-container-builder
          cache-to: type=gha,scope=quality-container-builder,mode=max
      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: saveany-quality:runtime
          build-args: |
            VERSION=ci
            GitCommit=${{ github.sha }}
            BuildTime=ci
          cache-from: |
            type=gha,scope=quality-container-builder
            type=gha,scope=quality-container-runtime
          cache-to: type=gha,scope=quality-container-runtime,mode=max
      - name: Test actual container runtime
        run: |
          sh tests/container_smoke_test.sh saveany-quality:runtime saveany-quality:builder \
            "$RUNNER_TEMP/core-tests" "$RUNNER_TEMP/database-tests" "$GITHUB_SHA"
